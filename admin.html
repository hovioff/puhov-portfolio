<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><title>Проекты — управление</title><link rel="stylesheet" href="styles.css"><script type="module" src="js/admin.js"></script></head>
<body class="admin-page">
  <main class="admin-shell">
    <header class="admin-header"><a class="back-button" href="index.html"><span>‹</span><span>К работам</span></a><p class="eyebrow">УПРАВЛЕНИЕ</p></header>
    <section class="admin-section"><div class="admin-section-title"><div><p class="eyebrow">ПОРТФОЛИО</p><h1>Проекты</h1></div><button class="primary-button" id="addProject" type="button">Добавить <span>＋</span></button></div><div class="admin-list" id="adminList"></div></section>
    <section class="admin-section"><div class="admin-section-title"><div><p class="eyebrow">СТРУКТУРА КАТАЛОГА</p><h2>Типы и категории</h2></div></div>
      <div class="admin-builder"><form id="typeForm" class="builder-row"><input id="newType" required maxlength="36" placeholder="Новый тип работ"><button class="primary-button" type="submit">Добавить</button></form><div class="builder-list" id="typeList"></div>
      <form id="categoryForm" class="builder-row"><input id="newCategory" required maxlength="36" placeholder="Новая категория"><select id="categoryType" aria-label="Тип работ"></select><button class="primary-button" type="submit">Добавить</button></form><div class="builder-list" id="categoryList"></div></div>
    </section>
    <section class="admin-section editor" id="editor" hidden><div class="admin-section-title"><div><p class="eyebrow">КАРТОЧКА ПРОЕКТА</p><h2 id="editorHeading">Новый проект</h2></div><button class="icon-button" id="cancelEdit" type="button" aria-label="Закрыть редактор">×</button></div>
      <form id="projectForm" class="form-grid">
        <input type="hidden" name="id">
        <label>Название<input name="title" required maxlength="80" placeholder="Название проекта"></label>
        <label>Тип работ<select name="type" required></select></label>
        <label>Категория<select name="category" required></select></label>
        <label>Дата создания<input name="date" placeholder="1 октября 2026"></label>
        <label>Выполнено<input name="duration" placeholder="за 2 дня"></label>
        <label class="full-width">Описание<textarea name="description" rows="3" placeholder="Коротко о проекте"></textarea></label>
        <div class="full-width"><p class="upload-title">Слайды проекта</p><label class="drop-zone" id="dropZone" for="slides"><input id="slides" name="slides" type="file" accept="image/*" multiple><span>Перетащите изображения сюда</span><small>или нажмите, чтобы выбрать файлы</small></label></div>
        <div class="slide-preview full-width" id="slidePreview"></div>
        <div class="form-actions full-width"><button class="primary-button" type="submit">Сохранить проект <span>✓</span></button><button class="delete-button" id="deleteProject" type="button" hidden>Удалить проект</button><span id="saveStatus" role="status"></span></div>
      </form>
    </section>
    <p class="storage-note">Добавленные проекты и изображения хранятся в этом браузере. Для публикации на всех устройствах понадобится серверное хранилище.</p>
  </main>
</body>
</html>
